<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>淇淇轨迹</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script src="trail.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const layer = QiqiTrail.createLayer();
      const ratio = function () { return window.devicePixelRatio || 1; };

      function resize() {
        const scale = ratio();
        canvas.width = Math.max(1, Math.floor(window.innerWidth * scale));
        canvas.height = Math.max(1, Math.floor(window.innerHeight * scale));
      }
      resize();
      window.addEventListener("resize", resize);

      if (window.qiqiTrail) {
        window.qiqiTrail.onPoint(function (point) { layer.push(point.x, point.y); });
        window.qiqiTrail.onLaser(function (laser) { layer.setLaser(laser); });
      }

      let last = performance.now();
      function frame(now) {
        const dt = now - last;
        last = now;
        const scale = ratio();
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        layer.draw(ctx, window.innerWidth, window.innerHeight, dt);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }());
  </script>
</body>
</html>
